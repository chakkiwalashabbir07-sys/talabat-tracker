<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login - Student Entry System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white max-w-md w-full p-8 rounded-2xl shadow-xl space-y-6 border border-slate-200">
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 bg-blue-100 rounded-full text-blue-600 mb-2">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Portal Authentication</h1>
      <p class="text-xs text-slate-500">Sign in as Guard or Admin to manage entry/exit</p>
    </div>

    <!-- Error Message Alert Box -->
    <div id="errorBox" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg text-xs font-semibold"></div>

    <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
        <input type="text" id="username" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg text-sm transition">
        Sign In
      </button>
    </form>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      
      const errorBox = document.getElementById('errorBox');
      const submitBtn = document.getElementById('submitBtn');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      // Clear previous error and set button loading state
      errorBox.classList.add('hidden');
      errorBox.innerText = '';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        // Check if response is valid JSON (prevents HTML crash on 404/500 routes)
        const contentType = res.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
          throw new Error('API route not found. Verify server is running on localhost.');
        }

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('token', data.token);
          window.location.href = data.role === 'admin' ? '/admin.html' : '/index.html';
        } else {
          errorBox.innerText = data.message || 'Invalid username or password.';
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorBox.innerText = err.message || 'Server connection failed. Make sure "node server.js" is active.';
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In';
      }
    }
  </script>
</body>
</html>
